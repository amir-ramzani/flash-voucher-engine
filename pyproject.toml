[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-voucher-engine"
version = "1.0.0"
description = "Flash-sale voucher engine: atomic claims in Redis, durable persistence in DynamoDB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "redis>=5.0,<6",
  "boto3>=1.34",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
loadtest = ["aiohttp>=3.9", "httpx>=0.27", "locust>=2.29"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fakeredis[lua]>=2.23",
  "moto[dynamodb]>=5.0",
  "ruff>=0.5",
  "cfn-lint>=1.0",
]

[tool.setuptools.packages.find]
include = ["common*", "api*", "worker*", "reconciler*", "loadtest*", "scripts*"]

[tool.setuptools.package-data]
common = ["lua/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_postman.py" = ["E501"]  # embedded Postman JavaScript
