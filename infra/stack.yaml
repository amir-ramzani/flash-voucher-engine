AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Flash-sale voucher engine - DynamoDB, ElastiCache (Redis, Multi-AZ), ECS Fargate
  (api + worker + scheduled reconciler), ALB, CloudWatch dashboard and alarms.
  Uses an existing VPC (private subnets need a NAT gateway or VPC endpoints for ECR/Logs)
  and an existing Cognito user pool.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two, in different AZs (ALB)
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two, in different AZs (ECS tasks, ElastiCache)
  ImageUri:
    Type: String
    Description: e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/flash-voucher-engine:abc123
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  AdminGroup:
    Type: String
    Default: admin
  ApiDesiredCount:
    Type: Number
    Default: 2
  ApiCpu:
    Type: Number
    Default: 1024
  ApiMemory:
    Type: Number
    Default: 2048
  WorkerDesiredCount:
    Type: Number
    Default: 1
  CacheNodeType:
    Type: String
    Default: cache.t4g.small
  RedisWaitReplicas:
    Type: Number
    Default: 1
    Description: WAIT for this many replica acks after a WON (0 disables)
  ReconcileSchedule:
    Type: String
    Default: rate(5 minutes)
  RateLimitPerSec:
    Type: Number
    Default: 5

Resources:
  # ------------------------------------------------------------------ DynamoDB
  CampaignsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Campaigns"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: campaignId, AttributeType: S }
      KeySchema:
        - { AttributeName: campaignId, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-VoucherClaims"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: campaignId, AttributeType: S }
        - { AttributeName: userId, AttributeType: S }
      KeySchema:
        - { AttributeName: campaignId, KeyType: HASH }
        - { AttributeName: userId, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ------------------------------------------------------------------ Networking
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks (api, worker, reconciler)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # ------------------------------------------------------------------ ElastiCache
  # Cluster mode disabled: one primary + one replica, automatic Multi-AZ failover.
  # Keys still carry {campaign:<id>} hash tags so moving to cluster mode is a config change.
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub "${AWS::StackName} redis"
      SubnetIds: !Ref PrivateSubnetIds

  CacheParameterGroup:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis7
      Description: !Sub "${AWS::StackName} redis params"
      Properties:
        appendonly: "yes"  # AOF on replicas; reduces (does not remove) failover loss
        maxmemory-policy: noeviction  # never silently drop stock/claims keys

  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: !Sub "${AWS::StackName} claims"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      CacheParameterGroupName: !Ref CacheParameterGroup
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      Tags:
        - { Key: fis-target, Value: !Sub "${AWS::StackName}-redis" }

  # ------------------------------------------------------------------ IAM
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dynamodb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt CampaignsTable.Arn
                  - !GetAtt ClaimsTable.Arn

  # ------------------------------------------------------------------ ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 14

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8000 }]
          Command: [uvicorn, api.app:app, --host, 0.0.0.0, --port, "8000", --workers, "2", --no-access-log]
          Environment:
            - { Name: REDIS_URL, Value: !Sub "rediss://${Redis.PrimaryEndPoint.Address}:${Redis.PrimaryEndPoint.Port}/0" }
            - { Name: REDIS_WAIT_REPLICAS, Value: !Ref RedisWaitReplicas }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: CAMPAIGNS_TABLE, Value: !Ref CampaignsTable }
            - { Name: CLAIMS_TABLE, Value: !Ref ClaimsTable }
            - { Name: AUTH_MODE, Value: cognito }
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref CognitoClientId }
            - { Name: ADMIN_GROUP, Value: !Ref AdminGroup }
            - { Name: RATE_LIMIT_PER_SEC, Value: !Ref RateLimitPerSec }
            - { Name: METRICS_EMF, Value: "true" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-worker"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Command: [python, -m, worker.main]
          StopTimeout: 30
          Environment:
            - { Name: REDIS_URL, Value: !Sub "rediss://${Redis.PrimaryEndPoint.Address}:${Redis.PrimaryEndPoint.Port}/0" }
            - { Name: REDIS_WAIT_REPLICAS, Value: !Ref RedisWaitReplicas }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: CAMPAIGNS_TABLE, Value: !Ref CampaignsTable }
            - { Name: CLAIMS_TABLE, Value: !Ref ClaimsTable }
            - { Name: AUTH_MODE, Value: cognito }
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref CognitoClientId }
            - { Name: ADMIN_GROUP, Value: !Ref AdminGroup }
            - { Name: RATE_LIMIT_PER_SEC, Value: !Ref RateLimitPerSec }
            - { Name: METRICS_EMF, Value: "true" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  ReconcilerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-reconciler"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: reconciler
          Image: !Ref ImageUri
          Essential: true
          Command: [python, -m, reconciler.main, --fix]
          Environment:
            - { Name: REDIS_URL, Value: !Sub "rediss://${Redis.PrimaryEndPoint.Address}:${Redis.PrimaryEndPoint.Port}/0" }
            - { Name: REDIS_WAIT_REPLICAS, Value: !Ref RedisWaitReplicas }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: CAMPAIGNS_TABLE, Value: !Ref CampaignsTable }
            - { Name: CLAIMS_TABLE, Value: !Ref ClaimsTable }
            - { Name: AUTH_MODE, Value: cognito }
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref CognitoClientId }
            - { Name: ADMIN_GROUP, Value: !Ref AdminGroup }
            - { Name: RATE_LIMIT_PER_SEC, Value: !Ref RateLimitPerSec }
            - { Name: METRICS_EMF, Value: "true" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: reconciler

  # ------------------------------------------------------------------ Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  # TODO: add an HTTPS listener with an ACM certificate before exposing real tokens.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref ApiDesiredCount
      TaskDefinition: !Ref ApiTaskDefinition
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup }

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref WorkerDesiredCount
      TaskDefinition: !Ref WorkerTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]

  # ------------------------------------------------------------------ Scheduled reconciler
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-reconciler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ReconcilerTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  ReconcilerRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref ReconcileSchedule
      State: ENABLED
      Targets:
        - Id: reconciler
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt SchedulerRole.Arn
          EcsParameters:
            LaunchType: FARGATE
            TaskCount: 1
            TaskDefinitionArn: !Ref ReconcilerTaskDefinition
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets: !Ref PrivateSubnetIds
                SecurityGroups: [!Ref AppSecurityGroup]
                AssignPublicIp: DISABLED

  # ------------------------------------------------------------------ Observability
  # Metrics arrive via Embedded Metric Format in the task logs (namespace FlashVoucher).
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Claim events dead-lettered (claims at risk of not being persisted)
      Namespace: FlashVoucher
      MetricName: DeadLettered
      Dimensions: [{ Name: Service, Value: worker }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RevokedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Durable cap revoked claims - Redis over-issued (likely failover loss)
      Namespace: FlashVoucher
      MetricName: PersistRevoked
      Dimensions: [{ Name: Service, Value: worker }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reconciler found Redis/DynamoDB drift
      Namespace: FlashVoucher
      MetricName: Drift
      Dimensions: [{ Name: Service, Value: reconciler }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{
              "title":"Claim latency (ms)","region":"${AWS::Region}","view":"timeSeries","period":10,
              "metrics":[
                ["FlashVoucher","ClaimLatency","Service","api",{"stat":"p50","label":"p50"}],
                ["...",{"stat":"p99","label":"p99"}]],
              "annotations":{"horizontal":[{"label":"p99 target","value":100}]}}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{
              "title":"Claim outcomes / 10s","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":10,
              "metrics":[
                ["FlashVoucher","ClaimWon","Service","api"],
                [".","ClaimAlready",".","."],
                [".","ClaimSoldOut",".","."],
                [".","ClaimRateLimited",".","."],
                [".","ClaimReplicationLagging",".","."]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{
              "title":"Stream lag (worker)","region":"${AWS::Region}","view":"timeSeries","stat":"Maximum","period":10,
              "metrics":[
                ["FlashVoucher","StreamPending","Service","worker"],
                [".","StreamLag",".","."]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{
              "title":"Persistence","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":10,
              "metrics":[
                ["FlashVoucher","PersistIssued","Service","worker"],
                [".","PersistDuplicate",".","."],
                [".","PersistRevoked",".","."],
                [".","PersistErrors",".","."],
                [".","DeadLettered",".","."]]}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{
              "title":"Reconciler drift","region":"${AWS::Region}","view":"timeSeries","stat":"Maximum","period":300,
              "metrics":[["FlashVoucher","Drift","Service","reconciler"]]}},
            {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{
              "title":"Redis","region":"${AWS::Region}","view":"timeSeries","period":60,
              "metrics":[
                ["AWS/ElastiCache","EngineCPUUtilization","ReplicationGroupId","${Redis}",{"stat":"Maximum"}],
                [".","ReplicationLag",".",".",{"stat":"Maximum","yAxis":"right"}]]}}
          ]
        }

Outputs:
  ApiUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${AWS::StackName}-Cluster" }
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
    Export: { Name: !Sub "${AWS::StackName}-WorkerService" }
  RedisReplicationGroupId:
    Value: !Ref Redis
    Export: { Name: !Sub "${AWS::StackName}-RedisReplicationGroup" }
  RedisEndpoint:
    Value: !GetAtt Redis.PrimaryEndPoint.Address
  CampaignsTableName:
    Value: !Ref CampaignsTable
  ClaimsTableName:
    Value: !Ref ClaimsTable
