AWSTemplateFormatVersion: "2010-09-09"
Description: Flash-sale voucher engine - container registry (deploy before stack.yaml)

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: flash-voucher-engine
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 10",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
